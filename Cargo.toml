[workspace]
resolver = "2"
members = ["crates/synapta-core", "crates/synapta-gateway", "crates/synapta-node"]

[workspace.package]
version = "0.0.2"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
synapta-core = { path = "crates/synapta-core" }
synapta-gateway = { path = "crates/synapta-gateway" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
ed25519-dalek = "2"
getrandom = "0.2"
# Noise NN + ChaChaPoly + SHA-256 only (see discovery/handshake.rs); nothing else compiled in.
snow = { version = "0.10", default-features = false, features = ["std", "default-resolver", "use-curve25519", "use-chacha20poly1305", "use-sha2", "use-getrandom"] }
httparse = "1"
tempfile = "3"
