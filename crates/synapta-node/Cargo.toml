[package]
name = "synapta-node"
description = "Synapta node daemon, CLI client and sandbox launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "synapta-node"
path = "src/main.rs"

[[bin]]
name = "synapta"
path = "src/bin/synapta.rs"

[[bin]]
name = "synapta-sandbox"
path = "src/bin/synapta-sandbox.rs"

[dependencies]
synapta-core.workspace = true
synapta-gateway.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true
